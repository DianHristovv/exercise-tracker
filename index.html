<!DOCTYPE html>
<html>
<head>
  <title>Exercise Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>My Workouts</h1>

  <form id="workout-form">
    <input id="exercise" placeholder="Exercise">
    <p id="last-time"></p>
    <input id="date" type="date">

    <input id="reps" type="number" placeholder="Reps">
    <input id="weight" type="number" placeholder="Weight (kg)">
    <button type="button" id="add-set">Add set</button>
    <p id="rest-timer"></p>

    <ul id="current-sets"></ul>

    <button type="submit">Save workout</button>
  </form>

  <h2>Personal records</h2>
<ul id="records-list"></ul>

<h2>Stats</h2>
<div class="stats">
  <ul id="total-workouts"></ul>
  <ul id="total-weight"></ul>
</div>

<h2>Workouts</h2>
<ul id="workout-list"></ul>

  <script src="script.js"></script>
</body>
</html>
